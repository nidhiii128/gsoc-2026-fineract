<svg viewBox="0 0 900 380" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5a6478"/>
    </marker>
    <style>text { font-family: Inter, -apple-system, sans-serif; }</style>
  </defs>

  <rect x="20" y="20" width="180" height="60" rx="10" fill="#eef3fc" stroke="#1e2761" stroke-width="1"/>
  <text x="110" y="48" text-anchor="middle" font-size="13" font-weight="600" fill="#1e2761">REST Request</text>
  <text x="110" y="66" text-anchor="middle" font-size="11" fill="#5a6478" font-family="JetBrains Mono, monospace">POST /api/v1/xxx</text>

  <rect x="240" y="20" width="200" height="60" rx="10" fill="#eef3fc" stroke="#1e2761" stroke-width="1"/>
  <text x="340" y="42" text-anchor="middle" font-size="13" font-weight="600" fill="#1e2761">Typed Request DTO</text>
  <text x="340" y="60" text-anchor="middle" font-size="11" fill="#5a6478">@NotBlank @NotNull</text>
  <text x="340" y="74" text-anchor="middle" font-size="11" fill="#5a6478">@Valid (Jakarta)</text>

  <rect x="480" y="20" width="200" height="60" rx="10" fill="#eef3fc" stroke="#1e2761" stroke-width="1"/>
  <text x="580" y="48" text-anchor="middle" font-size="13" font-weight="600" fill="#1e2761">Command&lt;XxxRequest&gt;</text>
  <text x="580" y="66" text-anchor="middle" font-size="11" fill="#5a6478">wraps the payload</text>

  <rect x="720" y="20" width="160" height="60" rx="10" fill="#f96167" stroke="#f96167"/>
  <text x="800" y="48" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">CommandDispatcher</text>
  <text x="800" y="66" text-anchor="middle" font-size="11" fill="#ffffff">routes to handler</text>

  <line x1="200" y1="50" x2="240" y2="50" stroke="#5a6478" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="440" y1="50" x2="480" y2="50" stroke="#5a6478" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="680" y1="50" x2="720" y2="50" stroke="#5a6478" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="800" y1="80" x2="800" y2="140" stroke="#5a6478" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="620" y="140" width="260" height="60" rx="10" fill="#eef3fc" stroke="#1e2761" stroke-width="1"/>
  <text x="750" y="162" text-anchor="middle" font-size="13" font-weight="600" fill="#1e2761">CommandHandler&lt;REQ, RES&gt;</text>
  <text x="750" y="180" text-anchor="middle" font-size="11" fill="#5a6478">@Retry, no @Transactional</text>
  <text x="750" y="194" text-anchor="middle" font-size="11" fill="#5a6478">returns typed XxxResponse</text>

  <line x1="620" y1="170" x2="440" y2="170" stroke="#5a6478" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="180" y="140" width="260" height="60" rx="10" fill="#eef3fc" stroke="#1e2761" stroke-width="1"/>
  <text x="310" y="162" text-anchor="middle" font-size="13" font-weight="600" fill="#1e2761">Service.xxx(XxxRequest)</text>
  <text x="310" y="180" text-anchor="middle" font-size="11" fill="#5a6478">typed input, no JSON parsing</text>
  <text x="310" y="194" text-anchor="middle" font-size="11" fill="#5a6478">returns XxxResponse POJO</text>

  <line x1="310" y1="200" x2="310" y2="260" stroke="#5a6478" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="180" y="260" width="260" height="60" rx="10" fill="#1e2761" stroke="#1e2761"/>
  <text x="310" y="290" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">JPA / Database</text>
  <text x="310" y="308" text-anchor="middle" font-size="11" fill="#cadcfc">Postgres &#183; MySQL &#183; MariaDB</text>

  <rect x="500" y="260" width="360" height="60" rx="10" fill="#ffffff" stroke="#f96167" stroke-width="1.5" stroke-dasharray="6,3"/>
  <text x="680" y="284" text-anchor="middle" font-size="13" font-weight="700" fill="#f96167">URL-Level Security (SecurityConfig)</text>
  <text x="680" y="302" text-anchor="middle" font-size="11" fill="#5a6478">CREATE_XXX &#183; UPDATE_XXX &#183; DELETE_XXX permissions</text>
</svg>
